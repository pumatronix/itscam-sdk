name: Verify compatibility

# Runs `make verify` (tools/verify/verify.sh) on every pull request and push
# to main: the Linux cores at the glibc 2.23 floor on x64, ARMv7 and ARM64,
# every language's smoke test against the camera stand-in (ARM under qemu),
# consumers built with every supported compiler and C++ standard, the CMake
# build matrix, and the API/ABI comparison with the last release
# (compat/baseline).  docs/compatibility.md explains each check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # The compat step builds the baseline release from its tag
          fetch-depth: 0

      - name: Set up QEMU (ARM containers)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same images and cache scopes as sdk-release.yml
      - name: Build itscam-sdk-builder image (cached in GHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: itscam-sdk-builder:ci
          cache-from: type=gha,scope=itscam-sdk-builder
          cache-to: type=gha,mode=max,scope=itscam-sdk-builder

      - name: Build core-xenial image (cached in GHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: core-xenial
          load: true
          tags: itscam-sdk-core-xenial:ci
          cache-from: type=gha,scope=itscam-sdk-core-xenial
          cache-to: type=gha,mode=max,scope=itscam-sdk-core-xenial

      # Docker's own builder: RUN steps in buildx's container builder couldn't
      # resolve archive.ubuntu.com on GitHub's runners, and the cached images
      # above never run them.  This image is small enough not to need a cache.
      - name: Build compat image
        run: docker buildx build --builder default --target compat -t itscam-sdk-compat:ci .

      - name: make verify
        env:
          BUILDER_IMAGE: itscam-sdk-builder:ci
          CORE_IMAGE: itscam-sdk-core-xenial:ci
          COMPAT_IMAGE: itscam-sdk-compat:ci
        run: tools/verify/verify.sh

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            build/verify/compat/abi-*.txt
            build/verify/compat/api-*.diff
            build/verify/cmake/*.log
          if-no-files-found: ignore
          retention-days: 30
