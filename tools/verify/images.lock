# The images tools/verify/verify.sh runs the smoke tests in: one line per
# image and platform, with the digest of that platform's manifest.
#
#   <image:tag> <platform> <digest>
#
# Pinned so that every run tests in the same environments, and so that
# nothing has to be looked up: registries limit anonymous lookups, and a CI
# run made enough of them to fail.  The digest is the same in every registry
# (tools/verify/common.sh tries a mirror, then Docker Hub).
#
# To change an image or add one: remove its lines, run `make verify`, and add
# the lines it prints.
